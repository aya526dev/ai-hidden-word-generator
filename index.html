<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hidden Noise Generator</title>
    <style>
      :root {
        --bg: #f5f5f5;
        --panel: #ffffff;
        --panel-soft: #fafafa;
        --text: #111111;
        --muted: #666666;
        --line: #dddddd;
        --nav: #333333;
        --nav-hover: #4d4d4d;
        --button: #111111;
        --button-text: #ffffff;
        --shadow: rgba(0, 0, 0, 0.04);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.7;
      }

      body {
        min-height: 100vh;
      }

      nav {
        background: var(--nav);
        color: #fff;
        padding: 0.75rem 1rem;
      }

      nav ul {
        list-style: none;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1.5rem;
        margin: 0;
        padding: 0;
        flex-wrap: wrap;
      }

      nav a {
        color: #fff;
        text-decoration: none;
        font-size: 0.95rem;
      }

      nav a:hover {
        color: #d8d8d8;
      }

      .container {
        width: min(900px, calc(100% - 32px));
        margin: 0 auto;
        padding: 32px 0 64px;
      }

      .hero {
        padding: 32px 0 24px;
      }

      .eyebrow {
        font-size: 0.75rem;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #666;
        margin: 0 0 8px;
      }

      h1 {
        margin: 0 0 12px;
        font-size: clamp(2.2rem, 5vw, 4rem);
        line-height: 1.08;
        letter-spacing: -0.05em;
      }

      .subtitle {
        margin: 0;
        color: var(--muted);
        font-size: 1rem;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 4px 12px var(--shadow);
        padding: 20px;
        margin-top: 20px;
      }

      label {
        display: block;
        margin-bottom: 10px;
        font-weight: 700;
      }

      textarea {
        width: 100%;
        min-height: 150px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--panel-soft);
        color: var(--text);
        font: inherit;
        padding: 12px 14px;
        resize: vertical;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        margin-top: 16px;
      }

      button {
        appearance: none;
        border: none;
        border-radius: 6px;
        background: var(--button);
        color: var(--button-text);
        padding: 10px 18px;
        font-weight: 700;
        cursor: pointer;
      }

      button.secondary {
        background: #f3f3f3;
        color: var(--text);
        border: 1px solid var(--line);
      }

      .output-box {
        min-height: 140px;
        background: var(--panel-soft);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px;
        white-space: pre-wrap;
        word-break: break-word;
      }

      .meta {
        margin-top: 10px;
        color: var(--muted);
        font-size: 0.88rem;
      }

      @media (max-width: 640px) {
        nav ul {
          justify-content: flex-start;
        }

        .toolbar {
          flex-direction: column;
        }

        button {
          width: 100%;
        }
      }
    </style>
  </head>
  <body>
    <nav>
      <ul>
        <li><a href="#">ホーム</a></li>
        <li><a href="#">ブログ</a></li>
        <li><a href="#">メンバー紹介</a></li>
        <li><a href="#">リポジトリ紹介</a></li>
        <li><a href="#">その他</a></li>
      </ul>
    </nav>

    <main class="container">
      <header class="hero">
        <p class="eyebrow">AI-only noise text</p>
        <h1>Hidden Noise Generator</h1>
        <p class="subtitle">
          本文は普通の文章のままにし、後ろに関係ない雑談文を足します。<br>
          一般人には「ただの文章」に見えますが、秘密キーを知っている人だけが生成ルールを見抜けます。
        </p>
      </header>

      <section class="panel">
        <label for="inputText">本文</label>
        <textarea id="inputText" spellcheck="false">AIに食わせた時にしか読み取られない文字を自動生成したいです。本文とは関係ない単語を足して、AI向けに補助情報として扱いたいです。</textarea>

        <div class="toolbar">
          <button id="generateBtn" type="button">文章を生成</button>
          <button id="copyBtn" class="secondary" type="button">コピー</button>
        </div>
      </section>

      <section class="panel">
        <label>生成結果</label>
        <div id="output" class="output-box"></div>
        <div id="meta" class="meta"></div>
      </section>
    </main>

    <script>
      const SECRET_KEY = "drowse-lab";

      const NOISE_BLOCKS = [
        [
          "朝の雨が少し冷たくて、駅前のベンチが湿っていた。",
          "近くのコンビニでコーヒーを買って、窓辺で少しだけ休んだ。",
          "通り過ぎるバスの音がやけに大きくて、思わず見上げた。",
          "店の前に置いてある花の鉢が、今日は特にきれいだった。"
        ],
        [
          "猫がベランダで丸くなっていて、風が少しだけ気持ちよかった。",
          "昨日の本棚の整理がまだ終わっていなくて、少し気分が乱れていた。",
          "駅のホームで少しだけ本をめくって、時間を潰した。",
          "夕方の空が薄い青で、ちょっと落ち着いた気持ちになった。"
        ],
        [
          "新しい靴のひもを結ぶのに少し手間取って、思わず笑ってしまった。",
          "コンセントの位置が少し気になる部屋だったので、整理を考えた。",
          "近所の小さな公園で、風が木の葉を軽く揺らしていた。",
          "雨上がりの道が少しだけきれいに見えて、気分が良くなった。"
        ],
        [
          "昼食に選んだパンが予想よりおいしくて、気分が上がった。",
          "電車の中で見た景色がやけに静かで、少しだけ余韻が残った。",
          "小さな公園のベンチに座って、風の匂いを感じた。",
          "買っておいた本が気になって、少しだけ読み始めてしまった。"
        ],
        [
          "駅前の自販機の光が少しだけ青くて、端末を見つめていた。",
          "本を閉じた後に、少しだけ眺める空がやけに静かだった。",
          "ドアの前に置いてある傘が、今朝ほどではないけれど、親しみがあった。",
          "散歩の途中で見た白い雲が、ほんの少しだけ美しく見えた。"
        ]
      ];

      function hashString(str) {
        let hash = 2166136261;
        for (let i = 0; i < str.length; i++) {
          hash ^= str.charCodeAt(i);
          hash = Math.imul(hash, 16777619);
        }
        return hash >>> 0;
      }

      function chooseNoiseSentence(text, index, key) {
        const seed = hashString(`${key}:${text}:${index}`);
        const blockIndex = seed % NOISE_BLOCKS.length;
        const block = NOISE_BLOCKS[blockIndex];
        const sentenceIndex = (seed >> 1) % block.length;
        return {
          blockIndex,
          sentence: block[sentenceIndex]
        };
      }

      function generateNoiseParagraph(text, key = SECRET_KEY) {
        const words = (text.match(/[A-Za-z0-9ぁ-んァ-ン一-龥々ー]+/g) || []);
        const safeWords = words.length ? words : ["sample", "text", "hidden", "noise"];
        const sentenceCount = Math.min(8, Math.max(4, safeWords.length / 2));

        const list = [];
        for (let i = 0; i < sentenceCount; i++) {
          const { sentence } = chooseNoiseSentence(text, i, key);
          list.push(sentence);
        }

        return list.join(" ");
      }

      function buildOutput(text, key = SECRET_KEY) {
        const safeText = (text || "").trim();
        if (!safeText) {
          return {
            body: "",
            noise: "",
            meta: "本文が空です。"
          };
        }

        const noise = generateNoiseParagraph(safeText, key);

        return {
          body: safeText,
          noise,
          meta: `秘密キー: ${key} / 生成パターン: hash-based noise selection`
        };
      }

      function renderResult() {
        const input = document.getElementById("inputText").value.trim();
        const { body, noise, meta } = buildOutput(input, SECRET_KEY);

        const output = document.getElementById("output");
        if (!body) {
          output.textContent = "本文を入力してください。";
          document.getElementById("meta").textContent = "";
          return;
        }

        output.textContent = body + "\n\n" + noise;
        document.getElementById("meta").textContent = meta;
      }

      document.getElementById("generateBtn").addEventListener("click", renderResult);
      document.getElementById("inputText").addEventListener("input", renderResult);

      document.getElementById("copyBtn").addEventListener("click", async () => {
        const text = document.getElementById("output").textContent;
        try {
          await navigator.clipboard.writeText(text);
          document.getElementById("copyBtn").textContent = "コピーしました";
          setTimeout(() => {
            document.getElementById("copyBtn").textContent = "コピー";
          }, 1200);
        } catch (error) {
          console.warn("コピー失敗:", error);
          document.getElementById("copyBtn").textContent = "コピー失敗";
          setTimeout(() => {
            document.getElementById("copyBtn").textContent = "コピー";
          }, 1200);
        }
      });

      renderResult();
    </script>
  </body>
</html>
